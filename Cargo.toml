[workspace]
resolver = "2"
members = [
    "crates/zmpanel-core",
    "crates/zmpanel-server",
]

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "MIT"
authors = ["zmpanel"]

[workspace.dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.44", features = ["full"] }
tracing = "0.1"
uuid = { version = "1.15", features = ["v4", "serde"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
